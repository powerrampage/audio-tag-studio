<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio Tag Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Audio Tag Studio</h1>
    <p class="hint">Edit tags and convert audio. Everything runs in your browser; files are never uploaded.</p>

    <label class="drop" id="drop">
      <span id="drop-text">Drop an audio file here or click to choose</span>
      <input type="file" id="file" accept="audio/*,.m4a,.mp3,.flac,.ogg,.wav" hidden />
    </label>

    <section class="editor" id="editor" hidden>
      <div class="cover">
        <img id="cover-img" alt="Cover" hidden />
        <div class="placeholder" id="cover-none">No cover</div>
        <label class="btn">Change cover
          <input type="file" id="cover-file" accept="image/*" hidden />
        </label>
        <button type="button" id="cover-remove">Remove</button>
      </div>
      <form class="form" id="form">
        <label>Title <input name="title" /></label>
        <label>Artist <input name="artist" /></label>
        <label>Album <input name="album" /></label>
        <label>Album artist <input name="albumArtist" /></label>
        <label>Year <input name="year" /></label>
        <label>Genre <input name="genre" /></label>
        <label>Track # <input name="track" /></label>
        <label>Output format
          <select name="format">
            <option>mp3</option><option>m4a</option><option>flac</option><option>ogg</option><option>wav</option>
          </select>
        </label>
        <button type="submit" class="primary" id="download">Download</button>
      </form>
    </section>
    <p class="error" id="error"></p>
  </main>

  <script src="vendor/jsmediatags.min.js"></script>
  <script src="vendor/ffmpeg.js"></script>
  <script src="app.js"></script>
</body>
</html>
